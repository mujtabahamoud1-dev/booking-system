services:
  db:
    image: postgres:18-alpine
    container_name: booking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d bookingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_EXPIRY_MINUTES}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_EXPIRY_DAYS}
    ports:
      - "8080:8080"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Served on host port 5173 so it matches the API's CORS allow-list.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: booking_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pg_data:
