server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are client-side routes, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets Vite emits.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
